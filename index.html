    const state = {
      scrolled: false,

    // === GEO ===
    async function detectCountry() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        state.isUruguay = data.country_code === 'UY';
        state.currency   = state.isUruguay ? '$' : 'USD';
      } catch (e) {
        console.log('No se pudo detectar país');
      }
    }

    // === TRACKING HELPERS ===
    function trackEvent(eventName, properties = {}) {
      if (typeof gtag !== 'undefined') gtag('event', eventName, properties);
      if (typeof fbq  !== 'undefined') fbq('trackCustom', eventName, properties);
      console.log('[track]', eventName, properties);
    }

    async function sendToGoogleSheets(data) {
      try {
        await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: data.name,
            email: data.email,
            telefono: data.phone || '',
            plan: data.plan,
            posicion_waitlist: data.waitlistPosition,
            timestamp: data.timestamp,
            source: data.source
          })
        });
        return { success: true };
      } catch (e) {
        return { success: false };
      }
    }

    async function handleSubmit() {
      const nameInput  = document.getElementById('input-name');
      const emailInput = document.getElementById('input-email');
      const phoneInput = document.getElementById('input-phone');
      const planInput  = document.getElementById('input-plan');

      if (!nameInput?.value || !emailInput?.value) {
        alert('Por favor completá nombre y email.');
        return;
      }

      const dataToSave = {
        name: nameInput.value,
        email: emailInput.value,
        phone: phoneInput?.value || '',
        plan: planInput?.value || 'semestral',
        timestamp: new Date().toISOString(),
        waitlistPosition: state.waitlistCount + 1,
        source: 'landing_page'
      };

      trackEvent('waitlist_joined', { plan: dataToSave.plan, has_phone: !!dataToSave.phone });
      await sendToGoogleSheets(dataToSave);

      state.submitted = true;
      state.waitlistCount++;

      const modal = document.querySelector('.modal-content');
      if (modal) {
        modal.innerHTML = `
          <button class="close-modal absolute top-4 right-4 text-stone-400 hover:text-white">
            <i data-lucide="x" class="w-6 h-6"></i>

<script>

// MOBILE INPUT FOCUS HELPERS
(function(){
  function onFocus(e){
    // small delay gives browser time to open the keyboard
    setTimeout(function(){
      try { e.target.scrollIntoView({behavior:'smooth', block:'center'}); } catch(e){}
      document.body.classList.add('input-focused');
    }, 300);
  }
  function onBlur(){ document.body.classList.remove('input-focused'); }

  document.addEventListener('DOMContentLoaded', function(){
    var els = document.querySelectorAll('input, textarea, select');
    els.forEach(function(el){
      el.addEventListener('focus', onFocus);
      el.addEventListener('blur', onBlur);
      // prevent iOS zoom by forcing font-size 16 (already in CSS)
    });

    // Special case: when modal opens, if on mobile, scroll modal-content into view
    var observer = new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        if (m.addedNodes && m.addedNodes.length){
          m.addedNodes.forEach(function(node){
            if (node.classList && node.classList.contains('modal-backdrop')){
              if (window.innerWidth <= 768){
                // ensure modal is visible
                setTimeout(function(){
                  var mc = node.querySelector('.modal-content');
                  if (mc) mc.scrollIntoView({behavior:'smooth', block:'center'});
                }, 250);
              }
            }
          });
        }
      });
    });
    observer.observe(document.body, {childList:true});
  });
})();




// TESTIMONIALS ROTATOR (expanded v3)
(function(){
  var testimonials = [
    { text: "Me anoté porque quiero beneficios claros para descubrir bodegas y restaurantes sin estar comparando promos todo el tiempo.", author: "— Camila, foodie y amante del vino" },
    { text: "Viajo a Uruguay y me sirve tener descuentos y cortesías en un solo lugar. Estoy deseando que se active para planear el itinerario.", author: "— Martín, viajero gastronómico" },
    { text: "Me gusta que hablen de rangos realistas (10–20%) y no de humo. Si se mantiene así de claro, me sumo de una.", author: "— Sofía, creadora de contenido" },
    { text: "Quiero usarlo para salir más seguido y probar lugares nuevos. Apenas esté activo, lo activo y lo recomiendo en mi grupo.", author: "— Agus, planera de salidas" }
  ];
  var idx = 0;
  function initialsFromAuthor(author) {
    if (!author) return "WF";
    var clean = author.replace(/[^A-Za-zÀ-ÿ\s]/g,'').trim();
    var parts = clean.split(/\s+/);
    if (parts.length >= 2) {
      return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
    }
    return clean.slice(0,2).toUpperCase() || "WF";
  }
  function show(i){
    idx = (i + testimonials.length) % testimonials.length;
    var t = testimonials[idx];
    var txt = document.getElementById('testimonial-text');
    var auth = document.getElementById('testimonial-author');
    var dots = document.getElementById('testimonial-dots');
    var av = document.getElementById('testimonial-avatar');
    if (txt) txt.textContent = t.text;
    if (auth) auth.textContent = t.author;
    if (av) av.textContent = initialsFromAuthor(t.author);
    if (dots){
      dots.innerHTML = '';
      testimonials.forEach(function(_, j){
        var d = document.createElement('span');
        d.className = 'w-2 h-2 rounded-full ' + (j===idx ? 'bg-rose-500' : 'bg-stone-600');
        dots.appendChild(d);
      });
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    show(0);
    var next = document.getElementById('next-testimonial');
    var prev = document.getElementById('prev-testimonial');
    if (next) next.addEventListener('click', function(){ show(idx+1); });
    if (prev) prev.addEventListener('click', function(){ show(idx-1); });
    setInterval(function(){ show(idx+1); }, 6500);
  });
})();
;
;

</script>

// Floating pill close handler (persists dismissal for 6 hours)
document.addEventListener('click', function(e){
  var p = document.getElementById('floating-pill');
  if (!p) return;
  if (e.target && e.target.id === 'close-floating') {
    p.style.display = 'none';
    try { localStorage.setItem('winesof_floating_dismiss', Date.now().toString()); } catch(e) {}
  }
});

// On load, auto-hide floating pill if dismissed recently (6 hours)
(function(){
  try {
    var t = localStorage.getItem('winesof_floating_dismiss');
    if (t) {
      var diff = Date.now() - parseInt(t,10);
      if (diff < 1000 * 60 * 60 * 6) { // 6 hours
        var p = document.getElementById('floating-pill');
        if (p) p.style.display = 'none';
      }
    }
  } catch(e){}
})();

</script>

<script>

// URGENCY: stable animated counter helper (v6) - polling approach
(function(){
  function animateCount(el, start, end, duration){
    if (!el) return;
    // clear any previous timer
    if (el._timer) { clearInterval(el._timer); el._timer = null; }
    start = Number(start) || 0; end = Number(end) || 0; duration = Number(duration) || 900;
    var range = end - start;
    if (range === 0) { el.textContent = end.toLocaleString(); window._lastWaitlistCount = end; return; }
    var minTimer = 50;
    var steps = Math.max(3, Math.ceil(duration / minTimer));
    var stepTime = Math.max(minTimer, Math.floor(duration / steps));
    var stepValue = range / steps;
    var current = start;
    var count = 0;
    el._timer = setInterval(function(){
      count++;
      var next = Math.round(start + stepValue * count);
      // ensure we don't oscillate around the end
      if ((range > 0 && next >= end) || (range < 0 && next <= end) || count >= steps) {
        el.textContent = end.toLocaleString();
        clearInterval(el._timer);
        el._timer = null;
        window._lastWaitlistCount = end;
        return;
      }
      el.textContent = next.toLocaleString();
    }, stepTime);
  }

  document.addEventListener('DOMContentLoaded', function(){
    try {
      window._lastWaitlistCount = (window.state && window.state.waitlistCount) ? window.state.waitlistCount : (parseInt(document.getElementById('urgency-count')?.textContent.replace(/\D/g,'')) || 0);
      var c = window._lastWaitlistCount;
      var urgency = document.getElementById('urgency-count');
      if (urgency) animateCount(urgency, Math.max(0, c - 3), c, 900);
      // ensure the floating pill displays the number too
      var pillBold = document.querySelector('#floating-pill .font-bold');
      if (pillBold) {
        pillBold.textContent = pillBold.textContent.replace(/\d[\d.,]*/g, c.toLocaleString());
      }
    } catch (err){ console.log('urgency init error', err); }
  });

  // Poll state.waitlistCount periodically (lighter and more predictable than MutationObserver)
  setInterval(function(){
    try {
      var current = (window.state && window.state.waitlistCount) ? window.state.waitlistCount : null;
      if (current === null) return;
      if (window._lastWaitlistCount == null) window._lastWaitlistCount = current;
      if (current !== window._lastWaitlistCount) {
        var urgencyEl = document.getElementById('urgency-count');
        // animate from last to current
        if (urgencyEl) animateCount(urgencyEl, window._lastWaitlistCount, current, 800);
        // update pill text without animation
        var pillBold = document.querySelector('#floating-pill .font-bold');
        if (pillBold) {
          pillBold.textContent = pillBold.textContent.replace(/\d[\d.,]*/g, current.toLocaleString());
        }
        window._lastWaitlistCount = current;
      }
    } catch(e){ console.log('urgency poll error', e); }
  }, 1200);
})();
</script>
